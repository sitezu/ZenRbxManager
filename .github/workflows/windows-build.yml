name: Windows app / size check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install app and build dependencies
        run: python -m pip install -e '.[build,test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Test original HTML design reference
        run: npm ci --ignore-scripts && npm test
      - name: Test original UI and Python backend
        run: python -m pytest -q
      - name: Build portable exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --name ZenRbxManager
          --icon assets-icon.ico --add-data "web;web" --collect-all webview --hidden-import clr
          --exclude-module tkinter --exclude-module matplotlib --exclude-module numpy
          --exclude-module pandas --exclude-module scipy --exclude-module PySide6
          --exclude-module PyQt6 --exclude-module IPython
          src/main.py
      - name: Enforce executable under 100 MB
        shell: python
        run: |
          from pathlib import Path
          exe = Path('dist/ZenRbxManager.exe')
          size = exe.stat().st_size
          print(f'EXE size: {size:,} bytes ({size / 1024**2:.1f} MiB)')
          assert size < 100_000_000, 'EXE exceeds 100 MB limit'
      - name: Smoke-test packaged UI and local API without an account
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/ZenRbxManager.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed ($($process.ExitCode))" }
      - name: Verify original UI renders in WebView2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/ZenRbxManager.exe') -ArgumentList '--ui-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WebView2 desktop UI smoke test failed ($($process.ExitCode))" }
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found' }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build per-user setup package
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" '/DMyAppVersion=candidate' 'packaging\ZenRbxManager.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          $setup = Get-Item 'dist/ZenRbxManager-Setup-candidate.exe'
          Write-Host "Setup size: $($setup.Length) bytes"
          if ($setup.Length -ge 100000000) { throw 'Setup exceeds 100 MB' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Out-File dist/SETUP-SHA256SUMS.txt -Encoding ascii
      - name: Smoke-test silent install, installed app, and uninstall
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ZenRbxManager-Installer-Smoke'
          $setup = (Resolve-Path 'dist/ZenRbxManager-Setup-candidate.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$folder" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed ($($install.ExitCode))" }
          $app = Join-Path $folder 'ZenRbxManager.exe'
          if (-not (Test-Path $app)) { throw 'Installed EXE missing' }
          $smoke = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app self-test failed ($($smoke.ExitCode))" }
          $gui = Start-Process -FilePath $app -ArgumentList '--ui-smoke-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "Installed WebView2 UI smoke test failed ($($gui.ExitCode))" }
          $uninstall = Join-Path $folder 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $remove = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed ($($remove.ExitCode))" }
          if (Test-Path $app) { throw 'Uninstall left the application EXE behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: ZenRbxManager-Windows
          path: dist/ZenRbxManager.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ZenRbxManager-Setup-Candidate
          path: |
            dist/ZenRbxManager-Setup-candidate.exe
            dist/SETUP-SHA256SUMS.txt
